<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071327">
<title>BMO</title>
<style>
:root{--lit:#75f5ec;--glow:#4df4eb;--bg:#071327;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,sans-serif;background:var(--bg);color:#e8ffff}
.face{position:absolute;inset:0;overflow:hidden;cursor:pointer;touch-action:manipulation;background:radial-gradient(ellipse 85% 95% at 50% 55%,#12345b,#0a2040 58%,#071327)}.face:before{content:"";position:absolute;inset:2.3vmin;border:1px solid #7ef8ed1f;border-radius:6vmin;pointer-events:none}.eyes{position:absolute;top:25%;left:50%;transform:translateX(-50%);width:min(72vw,110vh);height:min(27vw,36vh);display:flex;align-items:center;justify-content:space-between}.eye{width:27%;height:92%;border-radius:45%;background:var(--lit);box-shadow:0 0 24px var(--glow),0 0 60px #59f8ee9e,0 0 100px #59f8ee4d;transition:transform .22s,height .3s,border-radius .3s,background .3s}.cheek{position:absolute;top:56%;width:min(12vw,17vh);height:min(4vw,6vh);border-radius:50%;background:#ff8cbe;opacity:.48;filter:blur(15px)}.cheek.left{left:12%}.cheek.right{right:12%}.mouth{position:absolute;top:65%;left:50%;transform:translateX(-50%);width:min(12vw,18vh);height:min(5vw,8vh);border:clamp(5px,1vmin,11px) solid var(--lit);border-top:0;border-radius:0 0 100px 100px;filter:drop-shadow(0 0 13px var(--glow));transition:all .3s}.face[data-mood=happy] .eye{height:32%;background:transparent;box-shadow:none;border-bottom:clamp(11px,2vmin,24px) solid var(--lit);border-radius:0 0 100% 100%;transform:translateY(15%)}.face[data-mood=happy] .mouth,.face[data-mood=love] .mouth{width:min(20vw,28vh);height:min(9vw,12vh)}.face[data-mood=sad] .eye{height:72%;border-radius:48% 48% 57% 57%}.face[data-mood=sad] .mouth{top:72%;border:clamp(5px,1vmin,11px) solid var(--lit);border-bottom:0;border-radius:100px 100px 0 0}.face[data-mood=surprised] .eye{border-radius:50%;height:100%}.face[data-mood=surprised] .mouth{width:min(8vw,13vh);height:min(8vw,13vh);border:clamp(5px,1vmin,11px) solid var(--lit);border-radius:50%}.face[data-mood=sleepy] .eye{height:9%;border-radius:90px}.face[data-mood=love] .eye{background:#ff9ed3;box-shadow:0 0 30px #ff9ed3,0 0 65px #ff9ed388;clip-path:polygon(50% 96%,4% 49%,2% 26%,15% 7%,34% 5%,50% 24%,66% 5%,85% 7%,98% 26%,96% 49%)}.face[data-mood=love] .mouth{border-color:#ff9ed3}.face[data-mood=grumpy] .eye{height:75%;border-radius:16% 16% 50% 50%;background:#ffa994;box-shadow:0 0 26px #ffa994,0 0 65px #ffa99488}.face[data-mood=grumpy] .eye:first-child{transform:rotate(14deg)}.face[data-mood=grumpy] .eye:last-child{transform:rotate(-14deg)}.face[data-mood=grumpy] .mouth{top:73%;border-color:#ffa994;border-bottom:0;border-top:7px solid #ffa994;border-radius:100% 100% 0 0}.face.blink:not([data-mood=sleepy]) .eye{height:5%;clip-path:none;border:0;background:var(--lit);border-radius:90px}.face.listening .eye{animation:pulse 1.2s infinite}.face.talking .mouth{animation:talk .27s ease-in-out infinite alternate}.face.thinking .eye{animation:think 1s ease-in-out infinite alternate}.face:focus-visible{outline:3px solid #fff;outline-offset:-8px}
.status{position:absolute;left:50%;bottom:max(5%,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:2;width:min(80vw,700px);text-align:center;pointer-events:none}.caption{font-weight:600;font-size:clamp(16px,2.8vmin,28px);line-height:1.35;text-shadow:0 2px 15px #000;max-height:4.2em;overflow:hidden}.hint{margin-top:10px;color:#aed8dc;font-size:clamp(11px,1.5vmin,15px);letter-spacing:.07em}.input-panel{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);width:min(90vw,650px);z-index:3;display:flex;gap:10px;padding:9px;border-radius:18px;border:1px solid #8af8ef77;background:#071327ed;box-shadow:0 16px 40px #0009}.input-panel[hidden]{display:none}.input-panel input{flex:1;min-width:0;border:0;outline:0;border-radius:11px;background:#1a3150;color:#fff;padding:14px;font-size:16px}.input-panel button{background:#90fff4;color:#062530;border:0;border-radius:11px;padding:10px 17px;font-weight:800;cursor:pointer}
@keyframes pulse{50%{box-shadow:0 0 30px #fff,0 0 90px var(--glow)}}@keyframes think{to{transform:translateY(-10%);opacity:.73}}@keyframes talk{from{width:min(11vw,16vh);height:min(3vw,4vh)}to{width:min(14vw,20vh);height:min(11vw,15vh);border:clamp(5px,1vmin,11px) solid var(--lit);border-radius:45%;background:#75f5ec44}}
@media(max-height:520px){.eyes{top:17%}.cheek{top:50%}.mouth{top:58%}.status{bottom:3%}}@media(max-width:560px) and (orientation:portrait){.eyes{top:32%;width:82vw;height:27vh}.mouth{top:65%;width:20vw;height:8vw}.status{bottom:8%}}@media(prefers-reduced-motion:reduce){.face.thinking .eye,.face.listening .eye,.face.talking .mouth{animation-duration:.8s}}
</style>
</head>
<body>
<main id="face" class="face" data-mood="curious" role="button" tabindex="0" aria-label="Tap to talk to BMO">
  <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
  <div class="cheek left"></div><div class="cheek right"></div><div class="mouth"></div>
</main>
<div class="status" aria-live="polite"><div id="caption" class="caption">Hi, I'm BMO.</div><div id="hint" class="hint">Tap to speak · Hold to look · Press T to type</div></div>
<form id="inputPanel" class="input-panel" hidden><input id="question" type="text" maxlength="500" placeholder="Ask BMO something…" aria-label="Question for BMO"><button type="submit">Ask</button></form>
<script>
(()=>{
  const face=document.getElementById('face'),caption=document.getElementById('caption'),hint=document.getElementById('hint');
  const panel=document.getElementById('inputPanel'),questionInput=document.getElementById('question');
  let busy=false,recorder=null,recorded=[],recordTimer=null,holdTimer=null,longPress=false,observeSeconds=0,lastAction=Date.now(),player=null;
  function setMood(mood){face.dataset.mood=mood}
  function message(text,sub){caption.textContent=text;hint.textContent=sub||'Tap to speak · Hold to look · Press T to type'}
  function typeQuestion(){panel.hidden=false;questionInput.focus();message('What would you like to ask?')}
  function base64FromBytes(bytes){let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(binary)}
  async function post(path,body){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw new Error(data.error||'Request failed');return data}
  async function playVoice(encoded){if(!encoded)return;const binary=atob(encoded),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);const url=URL.createObjectURL(new Blob([bytes],{type:'audio/mpeg'}));player=new Audio(url);face.classList.add('talking');hint.textContent='AI voice · Tap to ask another question';try{await player.play();await new Promise(resolve=>{player.onended=resolve;player.onerror=resolve})}catch(e){hint.textContent='Audio needs speaker or browser permission'}finally{face.classList.remove('talking');URL.revokeObjectURL(url);player=null}}
  async function ask(body){if(busy)return;busy=true;lastAction=Date.now();panel.hidden=true;face.classList.add('thinking');setMood('curious');message('Let me think…','Looking through the camera and asking the AI');try{const data=await post('/api/ask',body);face.classList.remove('thinking');setMood(data.mood);message(data.answer,data.camera_used?'Camera frame used · AI voice':'Camera unavailable · Answered from your question');await playVoice(data.audio)}catch(e){face.classList.remove('thinking');setMood('sad');message(e.message,'Press T to type · Tap to try again')}finally{busy=false;lastAction=Date.now()}}
  async function observe(){if(busy||recorder)return;busy=true;face.classList.add('thinking');message('Let me take a look…','Looking through the camera');try{const data=await post('/api/observe',{});setMood(data.mood);message(data.answer,'Tap to speak · Hold to look · Press T to type')}catch(e){message(e.message)}finally{busy=false;face.classList.remove('thinking');lastAction=Date.now()}}
  function stopRecording(){if(!recorder||recorder.state!=='recording')return;clearTimeout(recordTimer);recorder.stop();face.classList.remove('listening');message('I heard you…','Transcribing your question')}
  async function startRecording(){if(busy)return;if(recorder&&recorder.state==='recording'){stopRecording();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){typeQuestion();message('Microphone unavailable. Type your question.');return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});if(!MediaRecorder.isTypeSupported('audio/webm')){stream.getTracks().forEach(t=>t.stop());typeQuestion();message('This browser cannot record WebM audio. Type your question.');return}recorded=[];recorder=new MediaRecorder(stream,{mimeType:'audio/webm'});recorder.ondataavailable=e=>{if(e.data.size)recorded.push(e.data)};recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const bytes=new Uint8Array(await new Blob(recorded,{type:'audio/webm'}).arrayBuffer());recorder=null;if(bytes.length)await ask({audio:base64FromBytes(bytes)})};recorder.start();face.classList.add('listening');setMood('surprised');message('I’m listening…','Tap again when you finish');recordTimer=setTimeout(stopRecording,10000)}catch(e){typeQuestion();message('No microphone is available. Type your question.')}}
  face.addEventListener('pointerdown',()=>{longPress=false;holdTimer=setTimeout(()=>{longPress=true;observe()},700)});
  for(const name of ['pointerup','pointercancel','pointerleave'])face.addEventListener(name,()=>clearTimeout(holdTimer));
  face.addEventListener('click',()=>{if(longPress){longPress=false;return}startRecording()});
  face.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();startRecording()}});
  document.addEventListener('keydown',e=>{if((e.key==='t'||e.key==='T')&&e.target!==questionInput)typeQuestion();if(e.key==='Escape')panel.hidden=true});
  panel.addEventListener('submit',e=>{e.preventDefault();const question=questionInput.value.trim();if(!question)return;questionInput.value='';ask({question})});
  fetch('/health').then(r=>r.json()).then(data=>{observeSeconds=data.observe_seconds;if(!data.api_key_present)message('BMO needs an API key','See README setup instructions');if(observeSeconds>0)setInterval(()=>{if(document.visibilityState==='visible'&&!busy&&!recorder&&Date.now()-lastAction>observeSeconds*1000)observe()},10000)}).catch(()=>message('Waiting for BMO’s server…'));
  setInterval(()=>{if(face.classList.contains('listening')||face.classList.contains('thinking'))return;face.classList.add('blink');setTimeout(()=>face.classList.remove('blink'),170)},4200);
})();
</script>
</body>
</html>
